<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaWorks Project Desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login hidden">
  <div class="login-card">
    <h1>NovaWorks<br>Project Desk</h1>
    <p class="muted">Meetings in, projects out.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" value="admin@novaworks.example" required></label>
      <label>Password<input id="password" type="password" value="Demo123!" required></label>
      <p id="loginErr" class="err"></p>
      <button class="btn" type="submit">Log in</button>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <strong class="brand">NovaWorks</strong>
    <nav id="nav"></nav>
    <span id="who" class="muted"></span>
    <button id="logout" class="btn ghost">Log out</button>
  </header>
  <main id="view"></main>
</div>
<script src="app.js"></script>
</body>
</html>
